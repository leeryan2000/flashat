<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WS Envelope Tester – direct</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    legend { padding: 0 8px; font-weight: 600; }
    label { display: block; margin: 8px 0 4px; font-size: 14px; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    textarea { height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2d6cdf; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .log { background: #0b1020; color: #d3e1ff; padding: 12px; border-radius: 8px; height: 220px; overflow: auto; white-space: pre-wrap; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color:#1f2a44; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>WebSocket Envelope Tester </h1>

  <fieldset>
    <legend>Login</legend>
    <label>Email</label>
    <input id="email" value="postmanTest@example.com" />
    <label>Password</label>
    <input id="password" type="password" value="123456" />
    <div style="margin-top:10px;">
      <button id="btnLogin">Login</button>
      <span id="loginStatus" style="margin-left:12px;">🔴 Not logged in</span>
    </div>
  </fieldset>

  <fieldset>
  <legend>Connection</legend>
  <label>WebSocket URL (e.g., <code>wss://host/ws</code>)</label>
  <input id="wsUrl" value="ws://localhost:8080/api/websocket/ws" />
  <div style="margin-top:10px;">
    <button id="btnConnect">Connect</button>
    <button id="btnDisconnect" disabled>Disconnect</button>
    <span id="status" style="margin-left:12px;">🔴 Disconnected</span>
  </div>
</fieldset>

  <fieldset>
    <legend>Envelope (client → server)</legend>
    <div class="row">
      <div>
        <label>Type</label>
        <input id="type" value="direct" />
      </div>
      <div>
        <label>Conversation ID</label>
        <input id="conversationId" placeholder="c-uuid-or-id" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>From UID</label>
        <input id="fromUid" placeholder="u-uuid-or-id" />
      </div>
      <div>
        <label>Client Msg ID (auto)</label>
        <input id="clientMsgId" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Seq (optional number)</label>
        <input id="seq" type="number" placeholder="leave blank to omit" />
      </div>
      <div>
        <label>Timestamp ms (ts)</label>
        <input id="ts" type="number" />
      </div>
    </div>
    <label>Body JSON</label>
    <textarea id="body">hello world</textarea>
    <div style="margin-top:10px;">
      <button id="btnSend" disabled>Send Envelope</button>
      <button id="btnAck" disabled title="Sends a fake ACK request shape for testing server handling">Send Read Receipt (example)</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Log</legend>
    <div id="log" class="log"></div>
  </fieldset>

  <script>
    // --- helpers ---
    function uuidv4() {
      // RFC 4122 v4
      const b = new Uint8Array(16);
      crypto.getRandomValues(b);
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const hex = [...b].map(x => x.toString(16).padStart(2, '0'));
      return `${hex[0]}${hex[1]}${hex[2]}${hex[3]}-${hex[4]}${hex[5]}-${hex[6]}${hex[7]}-${hex[8]}${hex[9]}-${hex[10]}${hex[11]}${hex[12]}${hex[13]}${hex[14]}${hex[15]}`;
    }

    function log(msg, dir) {
      const el = document.getElementById('log');
      const prefix = dir === 'out' ? '➡️  ' : dir === 'in' ? '⬅️  ' : 'ℹ️  ';
      el.textContent += `${prefix}${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    function prune(obj) {
      // remove undefined, null, empty string fields so omitempty-like effect
      Object.keys(obj).forEach(k => {
        const v = obj[k];
        if (v === undefined || v === null || v === '') delete obj[k];
      });
      return obj;
    }

    // --- UI state ---
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const btnLogin = document.getElementById('btnLogin');
    const loginStatusEl = document.getElementById('loginStatus');

    const wsUrl = document.getElementById('wsUrl');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnSend = document.getElementById('btnSend');
    const btnAck = document.getElementById('btnAck');
    const statusEl = document.getElementById('status');

    const typeEl = document.getElementById('type');
    const conversationIdEl = document.getElementById('conversationId');
    const fromUidEl = document.getElementById('fromUid');
    const clientMsgIdEl = document.getElementById('clientMsgId');
    const seqEl = document.getElementById('seq');
    const tsEl = document.getElementById('ts');
    const bodyEl = document.getElementById('body');

    const path = 'http://localhost:8080';
    // initialize defaults
    clientMsgIdEl.value = uuidv4();
    tsEl.value = Date.now();

    btnLogin.onclick = async () => {
      const email = emailEl.value.trim();
      const password = passwordEl.value.trim();

      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      try {
        const response = await fetch(`${path}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (response.ok) {
          loginStatusEl.textContent = '🟢 Logged in';
          log('Login successful', 'in');
        } else {
          const error = await response.json();
          loginStatusEl.textContent = '🔴 Not logged in';
          log(`Login failed: ${error.error}`, 'err');
        }
      } catch (err) {
        loginStatusEl.textContent = '🔴 Not logged in';
        log(`Login error: ${err.message}`, 'err');
      }
    };

    let ws = null;

    btnConnect.onclick = () => {
      if (ws) return;
      const url = wsUrl.value.trim();
      if (!url) { alert('Enter WebSocket URL'); return; }
      
      ws = new WebSocket(url);
      ws.onopen = () => {
        statusEl.textContent = '🟢 Connected';
        btnConnect.disabled = true;
        btnDisconnect.disabled = false;
        btnSend.disabled = false;
        btnAck.disabled = false;
        log(`Connected to ${url}`);
      };
      ws.onmessage = (ev) => log(ev.data, 'in');
      ws.onerror = (ev) => log(`WebSocket error (see console)`, 'err');
      ws.onclose = () => {
        statusEl.textContent = '🔴 Disconnected';
        btnConnect.disabled = false;
        btnDisconnect.disabled = true;
        btnSend.disabled = true;
        btnAck.disabled = true;
        ws = null;
        log(`Disconnected`);
      };
    };

    btnDisconnect.onclick = () => {
      if (ws) ws.close(1000, 'client closing');
    };

    btnSend.onclick = () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) { alert('Not connected'); return; }

      let bodyJson;
      try { bodyJson = JSON.parse(bodyEl.value || '{}'); }
      catch (e) { alert('Body must be valid JSON'); return; }

      const env = prune({
        type: (typeEl.value || 'direct').toLowerCase(),
        conversation_id: conversationIdEl.value,
        client_msg_id: clientMsgIdEl.value,
        from_uid: fromUidEl.value,
        seq: seqEl.value ? Number(seqEl.value) : undefined,
        ts: tsEl.value ? Number(tsEl.value) : Date.now(),
        body: bodyJson
      });

      // Show what we’re sending and send it
      const out = JSON.stringify(env);
      log(out, 'out');
      ws.send(out);

      // prep for next send: new client msg id + ts
      clientMsgIdEl.value = uuidv4();
      tsEl.value = Date.now();
    };

    // Example: send a read receipt (optional helper)
    btnAck.onclick = () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) { alert('Not connected'); return; }
      const lastSeq = Number(prompt('Enter last_read_seq to report:', '0') || '0');
      const env = {
        type: 'read_receipt',
        conversation_id: conversationIdEl.value,
        server_seq: lastSeq
      };
      const out = JSON.stringify(env);
      log(out, 'out');
      ws.send(out);
    };
  </script>
</body>
</html>
