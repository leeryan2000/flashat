server {
    listen 80;
    server_name _; # This catches all traffic to your IP

    # 1. Serve the Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This line is crucial for React Router
        # It sends all paths to index.html so React can handle the routing.
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Go Backend
    location /api/ {
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Handle WebSocket Connections
    location /api/websocket/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}