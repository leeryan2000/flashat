# Redirect HTTP to HTTPS 
server {
    listen 80;
    server_name flashatapp.com www.flashatapp.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name flashatapp.com www.flashatapp.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/certs/cloudflare.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare.key;

    # Docker's embedded DNS — re-resolve `backend` per request instead of
    # caching whatever IP it had when nginx started, so redeploys that
    # recreate the backend container (new IP) don't leave nginx pointing
    # at a dead address until it's manually restarted.
    resolver 127.0.0.11 valid=10s;

    # 1. Serve the Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Go Backend
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Handle WebSocket Connections
    location /api/websocket/ws {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}