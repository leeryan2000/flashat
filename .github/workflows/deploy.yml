name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------
  # JOB 1: Build and Push the Go Backend Image
  # ---------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flashat-backend:latest

# ---------------------------------------------------
  # JOB 2: Build and Push the React Frontend Image
  # ---------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flashat-frontend:latest

# ---------------------------------------------------
  # JOB 3: Ship Configs and Restart EC2 Containers
  # ---------------------------------------------------
  deploy-to-ec2:
    # This ensures the deploy only happens if BOTH builds succeed
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ship Config Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Copies your Nginx routing and Compose file
          source: "nginx/,docker-compose.yml" 
          target: "/home/ec2-user/app"

      - name: Pull Images and Start Docker on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            
            # Pull the fresh images from Docker Hub
            docker-compose pull

            # Restart the containers with the new images/configs
            docker-compose up -d --force-recreate

