name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------
  # JOB 1: Build and Push the Go Backend Image
  # ---------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flashat-backend:latest

# ---------------------------------------------------
  # JOB 2: Ship Configs and Restart EC2 Containers
  # ---------------------------------------------------
  deploy-to-ec2:
    # This ensures the deploy only happens if BOTH builds succeed
    needs: [build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Nginx Config Changed
        id: nginx-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nginx:
              - 'nginx/**'

      - name: Setup Node and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Ship Config Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Copies your Nginx routing, Compose file, and monitoring configs
          source: "nginx/,docker-compose.yml,frontend/dist/,monitoring/"
          target: "/home/ec2-user/app"

      - name: Write .env to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > /home/ec2-user/app/.env

      - name: Pull Images and Start Docker on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app

            # Free up disk space before pulling new images
            docker system prune -af

            # Pull the fresh images from Docker Hub
            docker-compose pull

            # Restart the containers with the new images/configs
            docker-compose up -d

            # Only reload nginx if its config changed
            if [ "${{ steps.nginx-changes.outputs.nginx }}" = "true" ]; then
              docker-compose restart nginx
            fi

