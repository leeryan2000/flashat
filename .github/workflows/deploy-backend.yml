name: Deploy Backend (Go)

on:
  push:
    branches: [ "main" ]
    paths:
      - '**'          # Run on any change
      - '!frontend/**' 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --- Build Binary on Github ---
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        run: |
          echo "Compiling for Linux..."
          # GOOS=linux ensures it runs on EC2 even if you build on Mac/Windows
          GOOS=linux GOARCH=amd64 go build -o flashat main.go

      # --- Upload Binary to EC2 ---
      - name: Copy Binary to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "flashat"      
          target: "/home/ec2-user/flashat/temp_artifacts" # Temporary folder

      # --- Restart Application on EC2 ---
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Stop the app
            sudo systemctl stop flashat

            # 2. Move the new binary into place
            # (We copy from the temp folder to the real folder)
            mv /home/ec2-user/flashat/temp_artifacts/flashat /home/ec2-user/flashat/flashat

            # 3. Make sure it's executable
            chmod +x /home/ec2-user/flashat/flashat

            # 4. Clean up temp folder
            rm -rf /home/ec2-user/flashat/temp_artifacts

            # 5. Start the app
            sudo systemctl start flashat
            echo "Deployment Successful!"
            systemctl status flashat --no-pager