services:
  backend:
    image: leeryan2000/flashat-backend:latest  # ← pulled from hub
    restart: always
    env_file: .env
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - flashat-net

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}         
      POSTGRES_PASSWORD: ${DB_PASS} 
      POSTGRES_DB: ${DB_NAME}           
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flashat-net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - flashat-net

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - flashat-net


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/flashat.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /etc/ssl/certs/cloudflare.pem:/etc/ssl/certs/cloudflare.pem:ro
      - /etc/ssl/private/cloudflare.key:/etc/ssl/private/cloudflare.key:ro
    restart: always
    depends_on:
      - backend
    networks:
      - flashat-net

  loki:
    image: grafana/loki:2.9.0
    restart: always
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - flashat-net

  promtail:
    image: grafana/promtail:2.9.0
    restart: always
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # read Docker logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - flashat-net

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # localhost only — not exposed to internet
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - flashat-net

networks:
  flashat-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  loki_data:
  grafana_data: